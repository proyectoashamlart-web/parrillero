<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Brawlers: Parrillero vs Robot</title>
  <style>
    body {
      background-color: #0d0e15;
      color: white;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #00f0ff;
      font-size: 1.1rem;
      margin: 5px 0;
      text-shadow: 0 0 8px #00f0ff;
    }
    #game-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
    }
    canvas {
      border: 3px solid #ff007f;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .bar-bg {
      width: 110px;
      height: 14px;
      background: #222;
      border: 1px solid #00f0ff;
      margin-top: 2px;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.15s;
    }
    #hp-p1 { background: #00ff66; width: 100%; }
    #hp-p2 { background: #ff0055; width: 100%; }
    #round-txt { color: #ffe600; text-shadow: 0 0 5px #ffe600; font-size: 0.9rem; }
    .score-txt { color: #00f0ff; font-size: 0.75rem; margin-top: 3px; }

    #btn-retry {
      display: none;
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      border: 2px solid #00f0ff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff007f;
      z-index: 10;
      touch-action: manipulation;
    }
    #btn-retry:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    button {
      padding: 12px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      touch-action: manipulation;
    }
    .btn-move { background: #1e293b; width: 60px; border: 1px solid #38bdf8; }
    .btn-jump { background: #334155; width: 100px; border: 1px solid #38bdf8; }
    .btn-def  { background: #eab308; color: #000; }
    .btn-atk  { background: #dc2626; }
    .btn-spc  { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: PARRILLERO VS ROBOT 🍖🤖</h1>

  <div id="game-container">
    <div class="hud">
      <div>
        <span>PARRILLERO</span>
        <div class="bar-bg"><div id="hp-p1" class="bar-fill"></div></div>
        <div id="score-p1" class="score-txt">PTS: 0</div>
      </div>
      <div id="round-txt">RONDA 1 / 3</div>
      <div>
        <span>ROBOT FUTURISTA</span>
        <div class="bar-bg"><div id="hp-p2" class="bar-fill"></div></div>
        <div id="score-p2" class="score-txt">PTS: 0</div>
      </div>
    </div>
    <canvas id="canvas" width="500" height="230"></canvas>
    <button id="btn-retry" onclick="restartFullGame()">REINTENTAR 🔄</button>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-move" onclick="moveP1(-15)">◀</button>
      <button class="btn-move" onclick="moveP1(15)">▶</button>
      <button class="btn-jump" onclick="jumpP1()">▲ SALTAR</button>
    </div>
    <div class="row">
      <button class="btn-def" onclick="defendP1()">🛡️ DEFENDER</button>
      <button class="btn-atk" onclick="attackP1()">🔥 ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">💥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const imgP1 = new Image(); imgP1.src = 'parrillero.png';
const imgP2 = new Image(); imgP2.src = 'robot.png';

// Sistema de Rondas, Puntos y Estado
let currentRound = 1;
let p1Wins = 0;
let p2Wins = 0;
let p1Score = 0;
let p2Score = 0;
let roundOver = false;
let gameOver = false;
let announcementMsg = "";
let announcementSubMsg = "";
let bgParticles = [];

// Jugadores
const p1 = { x: 20, y: 35, w: 120, h: 160, hp: 100, isAttacking: false, isDefending: false, fireball: null };
const p2 = { x: 360, y: 35, w: 120, h: 160, hp: 100, isAttacking: false, isDefending: false };
let sparks = [];

function createSparks(x, y) {
  for (let i = 0; i < 12; i++) {
    sparks.push({
      x: x,
      y: y + (Math.random() * 60 - 30),
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 5 + 3,
      color: Math.random() > 0.5 ? '#ff007f' : '#00f0ff',
      life: 12
    });
  }
}

// DIBUJAR FONDO PROCEDURAL CYBERPUNK POR RONDA
function drawCyberBackground() {
  let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (currentRound === 1) {
    skyGrad.addColorStop(0, '#030712'); skyGrad.addColorStop(1, '#1e1b4b');
  } else if (currentRound === 2) {
    skyGrad.addColorStop(0, '#111827'); skyGrad.addColorStop(1, '#450a0a');
  } else {
    skyGrad.addColorStop(0, '#0f172a'); skyGrad.addColorStop(1, '#3b0764');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Edificios Futuristas
  ctx.fillStyle = '#090d16';
  for (let i = 0; i < canvas.width; i += 40) {
    let h = 80 + Math.sin(i + currentRound) * 40;
    ctx.fillRect(i, canvas.height - 35 - h, 35, h);
  }

  // Grilla Neón del Suelo
  ctx.strokeStyle = currentRound === 2 ? '#ff4500' : '#00f0ff';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += 25) {
    ctx.beginPath();
    ctx.moveTo(x, 195);
    ctx.lineTo(x + (x - canvas.width / 2) * 0.5, canvas.height);
    ctx.stroke();
  }

  // Línea de Horizonte
  ctx.shadowBlur = 10;
  ctx.shadowColor = currentRound === 2 ? '#ff0055' : '#00f0ff';
  ctx.strokeStyle = ctx.shadowColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 195);
  ctx.lineTo(canvas.width, 195);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // DETALLES POR RONDA
  if (currentRound === 1) {
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText("🍢 CYBER BARBACOA - ESPERA: 15 MIN", 20, 25);
    ctx.fillStyle = '#051329';
    for (let i = 0; i < 4; i++) {
      let cx = 30 + (i * 22);
      ctx.fillRect(cx, 150, 12, 45);
      ctx.beginPath(); ctx.arc(cx + 6, 144, 6, 0, Math.PI * 2); ctx.fill();
    }
  } else if (currentRound === 2) {
    ctx.fillStyle = '#ff4500';
    ctx.font = 'bold 12px monospace';
    ctx.fillText("🔥 PARRILLAS EN ACCIÓN - COCINANDO", 20, 25);
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(180, 130, 140, 65);
    ctx.fillStyle = '#ff5500';
    ctx.fillRect(190, 145, 120, 6);
    if (Math.random() > 0.3) {
      bgParticles.push({
        x: 200 + Math.random() * 100, y: 140,
        vx: (Math.random() - 0.5) * 1, vy: -Math.random() * 2 - 1,
        size: Math.random() * 8 + 4, alpha: 0.6
      });
    }
  } else {
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 12px monospace';
    ctx.fillText("🥩 BANQUETE SERVIDO - BUEN PROVECHO", 20, 25);
    for (let i = 0; i < 3; i++) {
      let mx = 60 + (i * 150);
      ctx.fillStyle = '#334155'; ctx.fillRect(mx, 165, 50, 30);
      ctx.fillStyle = '#ff0055'; ctx.fillRect(mx + 15, 160, 20, 5);
    }
  }

  // Partículas de humo
  for (let i = bgParticles.length - 1; i >= 0; i--) {
    let p = bgParticles[i];
    ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.015;
    if (p.alpha <= 0) bgParticles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawCyberBackground();

  // DIBUJAR JUGADORES
  if (imgP1.complete && imgP1.naturalWidth !== 0) {
    ctx.drawImage(imgP1, p1.x, p1.y, p1.w, p1.h);
  } else {
    ctx.fillStyle = '#0284c7'; ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  }

  if (imgP2.complete && imgP2.naturalWidth !== 0) {
    ctx.drawImage(imgP2, p2.x, p2.y, p2.w, p2.h);
  } else {
    ctx.fillStyle = '#475569'; ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
  }

  // ESCUDO DE DEFENSA
  [p1, p2].forEach(p => {
    if (p.isDefending) {
      ctx.shadowBlur = 18; ctx.shadowColor = '#ffe600';
      ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 1.4, p.h / 1.4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  });

  // CHISPAS
  for (let i = sparks.length - 1; i >= 0; i--) {
    let s = sparks[i];
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  // BOLA DE FUEGO
  if (p1.fireball && !roundOver) {
    ctx.shadowBlur = 12; ctx.shadowColor = '#ff4500';
    ctx.fillStyle = '#ff3300';
    ctx.beginPath(); ctx.arc(p1.fireball.x, p1.fireball.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    p1.fireball.x += 10;

    if (p1.fireball.x > p2.x - 120 && p1.fireball.x < p2.x) {
      p2.isDefending = true;
      setTimeout(() => { p2.isDefending = false; }, 300);
    }

    if (p1.fireball.x >= p2.x && p1.fireball.x <= p2.x + p2.w) {
      if (!p2.isDefending) {
        p2.hp = Math.max(0, p2.hp - 20);
        updateHUD();
        checkRoundEnd();
      }
      createSparks(p2.x, p2.y + p2.h / 2);
      p1.fireball = null;
    } else if (p1.fireball.x > canvas.width) {
      p1.fireball = null;
    }
  }

  // Cartel de Fin de Ronda o Juego
  if (roundOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(announcementMsg, canvas.width / 2, gameOver ? 75 : 100);
    
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(announcementSubMsg, canvas.width / 2, gameOver ? 105 : 125);
    ctx.textAlign = 'start';
  }

  requestAnimationFrame(draw);
}

// IA DEL ROBOT
function robotCounterAttack() {
  if (roundOver || p2.hp <= 0) return;
  p2.isAttacking = true;
  createSparks(p2.x, p2.y + p2.h / 2);

  const dist = p2.x - (p1.x + p1.w);
  if (!p1.isDefending && dist < 45) {
    p1.hp = Math.max(0, p1.hp - 10);
    updateHUD();
    checkRoundEnd();
  }
  setTimeout(() => { p2.isAttacking = false; }, 200);
}

setInterval(() => {
  if (roundOver || p2.hp <= 0 || p1.hp <= 0) return;

  const dist = p2.x - (p1.x + p1.w);
  const decision = Math.random();

  if (dist > 30) {
    p2.x -= 12;
  } else if (dist < 5) {
    p2.x += 8;
  }

  if (dist <= 45 && decision > 0.35) {
    robotCounterAttack();
  } else if (decision < 0.3) {
    p2.isDefending = true;
    setTimeout(() => { p2.isDefending = false; }, 400);
  }
}, 380);

// REVISIÓN DE FIN DE RONDA Y CÁLCULO DE PUNTOS
function checkRoundEnd() {
  if (roundOver) return;

  if (p1.hp <= 0 || p2.hp <= 0) {
    roundOver = true;

    if (p1.hp > 0) {
      p1Wins++;
      const roundPoints = p1.hp; // Puntos basados en vida restante
      p1Score += roundPoints;
      announcementMsg = `¡PARRILLERO GANA LA RONDA ${currentRound}!`;
      announcementSubMsg = `+${roundPoints} PTS OBTENIDOS EN ESTA RONDA`;
    } else {
      p2Wins++;
      const roundPoints = p2.hp;
      p2Score += roundPoints;
      announcementMsg = `¡ROBOT GANA LA RONDA ${currentRound}!`;
      announcementSubMsg = `+${roundPoints} PTS OBTENIDOS EN ESTA RONDA`;
    }

    updateHUD();

    setTimeout(() => {
      if (currentRound < 3) {
        currentRound++;
        resetRound();
      } else {
        gameOver = true;
        let winnerText = "";
        if (p1Score > p2Score) {
          winnerText = `🏆 ¡PARRILLERO ES EL CAMPEÓN! (${p1Score} PTS)`;
        } else if (p2Score > p1Score) {
          winnerText = `🤖 ¡ROBOT ES EL CAMPEÓN! (${p2Score} PTS)`;
        } else {
          winnerText = `🤝 ¡EMPATE FINAL! (${p1Score} PTS EN TOTAES)`;
        }
        
        announcementMsg = winnerText;
        announcementSubMsg = `PUNTAJE FINAL: PARRILLERO ${p1Score} PTS vs ROBOT ${p2Score} PTS`;
        document.getElementById('btn-retry').style.display = 'block';
      }
    }, 1500);
  }
}

function resetRound() {
  p1.hp = 100;
  p2.hp = 100;
  p1.x = 20;
  p2.x = 360;
  p1.fireball = null;
  roundOver = false;
  document.getElementById('round-txt').innerText = `RONDA ${currentRound} / 3`;
  updateHUD();
}

function restartFullGame() {
  currentRound = 1;
  p1Wins = 0;
  p2Wins = 0;
  p1Score = 0;
  p2Score = 0;
  gameOver = false;
  bgParticles = [];
  sparks = [];
  document.getElementById('btn-retry').style.display = 'none';
  resetRound();
}

// CONTROLES JUGADOR
function moveP1(dir) {
  if (roundOver) return;
  p1.x = Math.max(0, Math.min(p2.x - p1.w + 10, p1.x + dir));
}

function jumpP1() {
  if (roundOver) return;
  if (p1.y === 35) {
    p1.y = -5;
    setTimeout(() => { p1.y = 35; }, 350);
  }
}

function attackP1() {
  if (roundOver) return;
  p1.isAttacking = true;
  p1.isDefending = false;
  createSparks(p1.x + p1.w, p1.y + p1.h / 2);

  const dist = p2.x - (p1.x + p1.w);
  if (dist <= 35) {
    if (!p2.isDefending) {
      p2.hp = Math.max(0, p2.hp - 15);
      updateHUD();
      checkRoundEnd();
    }
    setTimeout(robotCounterAttack, 120);
  }

  setTimeout(() => { p1.isAttacking = false; }, 250);
}

function defendP1() {
  if (roundOver) return;
  p1.isDefending = true;
  setTimeout(() => { p1.isDefending = false; }, 800);
}

function specialP1() {
  if (roundOver) return;
  if (!p1.fireball) {
    p1.fireball = { x: p1.x + p1.w, y: p1.y + p1.h / 2 };
  }
}

function updateHUD() {
  document.getElementById('hp-p1').style.width = p1.hp + '%';
  document.getElementById('hp-p2').style.width = p2.hp + '%';
  document.getElementById('score-p1').innerText = `PTS: ${p1Score}`;
  document.getElementById('score-p2').innerText = `PTS: ${p2Score}`;
}

draw();
</script>
</body>
</html>
