<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Brawlers: Parrillero vs Robot Cyberpunk</title>
  <style>
    body {
      background-color: #0d0e15;
      color: white;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #00f0ff;
      font-size: 1.1rem;
      margin: 5px 0;
      text-shadow: 0 0 8px #00f0ff;
    }
    #game-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
    }
    canvas {
      border: 3px solid #ff007f;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .bar-bg {
      width: 110px;
      height: 14px;
      background: #222;
      border: 1px solid #00f0ff;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    #hp-p1 { background: #00ff66; width: 100%; }
    #hp-p2 { background: #ff0055; width: 100%; }
    #round-txt { color: #ffe600; text-shadow: 0 0 5px #ffe600; }

    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    button {
      padding: 12px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      touch-action: manipulation;
    }
    .btn-move { background: #1e293b; width: 60px; border: 1px solid #38bdf8; }
    .btn-jump { background: #334155; width: 100px; border: 1px solid #38bdf8; }
    .btn-def  { background: #eab308; color: #000; }
    .btn-atk  { background: #dc2626; }
    .btn-spc  { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: PARRILLERO VS ROBOT 🍖🤖</h1>

  <div id="game-container">
    <div class="hud">
      <div>
        <span>EL PARRILLERO</span>
        <div class="bar-bg"><div id="hp-p1" class="bar-fill"></div></div>
      </div>
      <div id="round-txt">RONDA 1 / 3</div>
      <div>
        <span>ROBOT FUTURISTA</span>
        <div class="bar-bg"><div id="hp-p2" class="bar-fill"></div></div>
      </div>
    </div>
    <canvas id="canvas" width="500" height="230"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-move" onclick="moveP1(-15)">◀</button>
      <button class="btn-move" onclick="moveP1(15)">▶</button>
      <button class="btn-jump" onclick="jumpP1()">▲ SALTAR</button>
    </div>
    <div class="row">
      <button class="btn-def" onclick="defendP1()">🛡️ DEFENDER</button>
      <button class="btn-atk" onclick="attackP1()">🔥 ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">💥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Cargar Imágenes
const imgP1 = new Image();
imgP1.src = 'parrillero.png';

const imgP2 = new Image();
imgP2.src = 'robot.png';

// Sistema de Rondas
let currentRound = 1;
let p1Wins = 0;
let p2Wins = 0;
let roundOver = false;
let announcementMsg = "";

// Jugadores
const p1 = {
  x: 20,
  y: 35,
  w: 120,
  h: 160,
  hp: 100,
  isAttacking: false,
  isDefending: false,
  fireball: null
};

const p2 = {
  x: 360,
  y: 35,
  w: 120,
  h: 160,
  hp: 100,
  isAttacking: false,
  isDefending: false
};

let sparks = [];

function createSparks(x, y) {
  for (let i = 0; i < 12; i++) {
    sparks.push({
      x: x,
      y: y + (Math.random() * 60 - 30),
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 5 + 3,
      color: Math.random() > 0.5 ? '#ff007f' : '#00f0ff',
      life: 12
    });
  }
}

// Escenario Cyberpunk Nocturno
function drawCyberpunkBackground() {
  // Cielo Oscuro Degradado Synthwave
  let bgGrad = ctx.createLinearGradient(0, 0, 0, 200);
  bgGrad.addColorStop(0, '#090a10');
  bgGrad.addColorStop(0.7, '#2a0845');
  bgGrad.addColorStop(1, '#64004b');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sol/Luna Neón Synthwave
  ctx.fillStyle = '#ff007f';
  ctx.beginPath();
  ctx.arc(250, 90, 35, 0, Math.PI * 2);
  ctx.fill();

  // Edificios Cyberpunk de Fondo
  ctx.fillStyle = '#111322';
  ctx.fillRect(10, 60, 50, 140);
  ctx.fillRect(70, 40, 65, 160);
  ctx.fillRect(150, 80, 55, 120);
  ctx.fillRect(290, 50, 70, 150);
  ctx.fillRect(370, 70, 60, 130);
  ctx.fillRect(440, 30, 50, 170);

  // Ventanas / Luces Neón en Edificios
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(80, 50, 12, 60);
  ctx.fillRect(300, 70, 15, 40);
  ctx.fillRect(450, 50, 10, 80);

  ctx.fillStyle = '#ff007f';
  ctx.fillRect(20, 80, 8, 40);
  ctx.fillRect(160, 100, 10, 30);
  ctx.fillRect(380, 90, 12, 50);

  // Suelo Neón con Rejilla Cyberpunk
  ctx.fillStyle = '#0f111d';
  ctx.fillRect(0, 195, canvas.width, 35);

  ctx.strokeStyle = '#ff007f';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 195);
  ctx.lineTo(canvas.width, 195);
  ctx.stroke();

  // Líneas de Rejilla del Suelo
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 195);
    ctx.lineTo(x - 15, 230);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Escenario Cyberpunk
  drawCyberpunkBackground();

  // --- DIBUJAR PARRILLERO ---
  if (imgP1.complete && imgP1.naturalWidth !== 0) {
    ctx.drawImage(imgP1, p1.x, p1.y, p1.w, p1.h);
  } else {
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  }

  // --- DIBUJAR ROBOT FUTURISTA ---
  if (imgP2.complete && imgP2.naturalWidth !== 0) {
    ctx.drawImage(imgP2, p2.x, p2.y, p2.w, p2.h);
  } else {
    ctx.fillStyle = '#475569';
    ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
  }

  // --- AROS DE LUZ AMARILLOS (DEFENSA) ---
  [p1, p2].forEach(p => {
    if (p.isDefending) {
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffe600';
      ctx.strokeStyle = '#ffee00';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 1.4, p.h / 1.4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  });

  // --- CHISPAS Y FUEGO ---
  for (let i = sparks.length - 1; i >= 0; i--) {
    let s = sparks[i];
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    s.x += s.vx;
    s.y += s.vy;
    s.life--;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  // --- BOLA DE FUEGO ---
  if (p1.fireball) {
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff4500';
    ctx.fillStyle = '#ff3300';
    ctx.beginPath();
    ctx.arc(p1.fireball.x, p1.fireball.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    p1.fireball.x += 10;

    // IA Reacción a Bola de Fuego (Defiende y avanza a atacar)
    if (p1.fireball.x > p2.x - 120 && p1.fireball.x < p2.x) {
      p2.isDefending = true;
      setTimeout(() => { p2.isDefending = false; robotCounterAttack(); }, 400);
    }

    if (p1.fireball.x >= p2.x && p1.fireball.x <= p2.x + p2.w) {
      if (!p2.isDefending) {
        p2.hp = Math.max(0, p2.hp - 15);
        updateHUD();
        checkRoundEnd();
      }
      createSparks(p2.x, p2.y + p2.h / 2);
      p1.fireball = null;
    } else if (p1.fireball.x > canvas.width) {
      p1.fireball = null;
    }
  }

  // Anuncios de Fin de Ronda o Juego
  if (roundOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(announcementMsg, 70, 115);
  }

  requestAnimationFrame(draw);
}

// --- INTELIGENCIA ARTIFICIAL DEL ROBOT ---
function robotCounterAttack() {
  if (roundOver) return;
  p2.isAttacking = true;
  createSparks(p2.x, p2.y + p2.h / 2);

  const dist = p2.x - (p1.x + p1.w);
  if (!p1.isDefending && dist < 45) {
    p1.hp = Math.max(0, p1.hp - 10);
    updateHUD();
    checkRoundEnd();
  }
  setTimeout(() => { p2.isAttacking = false; }, 200);
}

setInterval(() => {
  if (roundOver || p2.hp <= 0 || p1.hp <= 0) return;

  const dist = p2.x - (p1.x + p1.w);
  const decision = Math.random();

  // Movimiento constante hacia el rival
  if (dist > 30) {
    p2.x -= 12;
  } else if (dist < 5) {
    p2.x += 8;
  }

  // Ataque Autónomo constante
  if (dist <= 45 && decision > 0.35) {
    robotCounterAttack();
  } else if (decision < 0.3) {
    p2.isDefending = true;
    setTimeout(() => { p2.isDefending = false; }, 500);
  }
}, 380);

// --- CONTROL DE RONDAS (3 RONDAS) ---
function checkRoundEnd() {
  if (roundOver) return;

  if (p1.hp <= 0 || p2.hp <= 0) {
    roundOver = true;

    if (p1.hp > 0) {
      p1Wins++;
      announcementMsg = `¡PARRILLERO GANA LA RONDA ${currentRound}!`;
    } else {
      p2Wins++;
      announcementMsg = `¡ROBOT GANA LA RONDA ${currentRound}!`;
    }

    setTimeout(() => {
      if (currentRound < 3) {
        currentRound++;
        resetRound();
      } else {
        const winner = p1Wins > p2Wins ? '¡PARRILLERO ES EL CAMPEÓN!' : '¡ROBOT ES EL CAMPEÓN!';
        announcementMsg = winner;
      }
    }, 2200);
  }
}

function resetRound() {
  p1.hp = 100;
  p2.hp = 100;
  p1.x = 20;
  p2.x = 360;
  p1.fireball = null;
  roundOver = false;
  document.getElementById('round-txt').innerText = `RONDA ${currentRound} / 3`;
  updateHUD();
}

// Controles Jugador
function moveP1(dir) {
  if (roundOver) return;
  p1.x = Math.max(0, Math.min(p2.x - p1.w + 10, p1.x + dir));
}

function jumpP1() {
  if (roundOver) return;
  if (p1.y === 35) {
    p1.y = -5;
    setTimeout(() => { p1.y = 35; }, 350);
  }
}

function attackP1() {
  if (roundOver) return;
  p1.isAttacking = true;
  p1.isDefending = false;
  createSparks(p1.x + p1.w, p1.y + p1.h / 2);

  const dist = p2.x - (p1.x + p1.w);
  if (dist <= 35) {
    if (!p2.isDefending) {
      p2.hp = Math.max(0, p2.hp - 10);
      updateHUD();
      checkRoundEnd();
    }
    // El robot responde/contraataca si es atacado de cerca
    setTimeout(robotCounterAttack, 150);
  }

  setTimeout(() => { p1.isAttacking = false; }, 250);
}

function defendP1() {
  if (roundOver) return;
  p1.isDefending = true;
  setTimeout(() => { p1.isDefending = false; }, 1000);
}

function specialP1() {
  if (roundOver) return;
  if (!p1.fireball) {
    p1.fireball = { x: p1.x + p1.w, y: p1.y + p1.h / 2 };
  }
}

function updateHUD() {
  document.getElementById('hp-p1').style.width = p1.hp + '%';
  document.getElementById('hp-p2').style.width = p2.hp + '%';
}

draw();
</script>
</body>
</html>
