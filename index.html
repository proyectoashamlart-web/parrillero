<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Div Brawlers: Cyberpunk Grill</title>
  <style>
    body { background-color: #0d0e15; color: white; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
    #game-container { position: relative; display: inline-block; width: 100%; max-width: 500px; }
    canvas { border: 3px solid #ff007f; border-radius: 6px; display: block; margin: 0 auto; width: 100%; background: #000; }
    
    /* Pantalla de Selección */
    #select-screen { display: block; background: #111827; padding: 20px; border: 2px solid #00f0ff; border-radius: 8px; }
    .char-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 20px 0; }
    .char-card { border: 2px solid #38bdf8; padding: 10px; cursor: pointer; transition: 0.3s; }
    .char-card:hover { border-color: #ff007f; background: #1e293b; }
    .char-card img { width: 100%; height: auto; display: block; margin-bottom: 5px; }
    
    #btn-restart { display: none; position: absolute; bottom: 20px; right: 20px; padding: 8px 16px; font-family: monospace; background: #0d0e15; color: #00f0ff; border: 1px solid #00f0ff; cursor: pointer; z-index: 20; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: CYBERPUNK GRILL</h1>

  <!-- Pantalla de Selección -->
  <div id="select-screen">
    <h2>ELIGE TU CONTRINCANTE</h2>
    <div class="char-grid">
      <!-- Asegúrate de tener los archivos .png en tu carpeta -->
      <div class="char-card" onclick="startGame('robot.png', '#00f0ff')">
        <img src="robot.png" alt="Robot"> 🤖 ROBOT
      </div>
      <div class="char-card" onclick="startGame('chef.png', '#ff0055')">
        <img src="chef.png" alt="Chef"> 🔪 CHEF
      </div>
      <div class="char-card" onclick="startGame('ninja.png', '#ffaa00')">
        <img src="ninja.png" alt="Ninja"> 🥷 NINJA
      </div>
    </div>
  </div>

  <div id="game-container" style="display:none;">
    <div class="hud"><div id="hud-stats">NIVEL 1 - RONDA 1/9</div></div>
    <canvas id="canvas" width="500" height="230"></canvas>
    <button id="btn-restart" onclick="location.reload()">VOLVER A JUGAR</button>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let round = 1, gameOver = false, selectedOponenteImg, oponenteColor;

// Imágenes de personajes
const p1Img = new Image(); p1Img.src = 'parrillero.png';
const oponenteImg = new Image();

function startGame(imgSrc, color) {
  selectedOponenteImg = imgSrc;
  oponenteColor = color;
  oponenteImg.src = imgSrc;
  
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'inline-block';
  gameLoop();
}

function drawSlash(x, y, color, isP1) {
  ctx.shadowBlur = 40; ctx.shadowColor = color;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(isP1 ? x + 40 : x, y + 30, 80, -Math.PI/3, Math.PI/3);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function gameLoop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0, canvas.width, canvas.height);

  // Dibujar personajes usando imágenes en lugar de bloques
  ctx.drawImage(p1Img, 50, 150, 60, 80);
  ctx.drawImage(oponenteImg, 400, 150, 60, 80);

  if(!gameOver && round <= 9) requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
