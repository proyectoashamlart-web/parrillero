<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Brawlers: Parrillero vs Robot</title>
  <style>
    body {
      background-color: #1a1a24;
      color: white;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #ff9900;
      font-size: 1.2rem;
      margin: 5px 0;
    }
    #game-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    canvas {
      background-color: #2b2b3d;
      border: 3px solid #ffffff;
      border-radius: 4px;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .bar-bg {
      width: 120px;
      height: 14px;
      background: #444;
      border: 1px solid #fff;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    #hp-p1 { background: #00ff66; width: 100%; }
    #hp-p2 { background: #ff3333; width: 100%; }
    
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    button {
      padding: 12px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      touch-action: manipulation;
    }
    .btn-move { background: #334155; width: 60px; }
    .btn-jump { background: #475569; width: 100px; }
    .btn-def  { background: #eab308; color: #000; }
    .btn-atk  { background: #dc2626; }
    .btn-spc  { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: PARRILLERO VS ROBOT 🍖🤖</h1>

  <div id="game-container">
    <div class="hud">
      <div>
        <span>EL PARRILLERO</span>
        <div class="bar-bg"><div id="hp-p1" class="bar-fill"></div></div>
      </div>
      <div>RONDA 1</div>
      <div>
        <span>ROBOT FUTURISTA</span>
        <div class="bar-bg"><div id="hp-p2" class="bar-fill"></div></div>
      </div>
    </div>
    <!-- Canvas con mayor altura interna para dar espacio a los muñecos grandes -->
    <canvas id="canvas" width="450" height="230"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-move" onclick="moveP1(-15)">◀</button>
      <button class="btn-move" onclick="moveP1(15)">▶</button>
      <button class="btn-jump" onclick="jumpP1()">▲ SALTAR</button>
    </div>
    <div class="row">
      <button class="btn-def" onclick="defendP1()">🛡️ DEFENDER</button>
      <button class="btn-atk" onclick="attackP1()">🔥 ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">💥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Cargar Imagen del Parrillero
const imgP1 = new Image();
imgP1.src = 'parrillero.png';

// Estado del jugador 1 (Parrillero)
const p1 = {
  x: 20,
  y: 65,
  w: 120, // TAMAÑO MUCHO MÁS GRANDE
  h: 140, // TAMAÑO MUCHO MÁS GRANDE
  hp: 100,
  isAttacking: false,
  isDefending: false,
  fireball: null
};

// Estado del Bot (Robot)
const p2 = {
  x: 300,
  y: 65,
  w: 120, // TAMAÑO MUCHO MÁS GRANDE
  h: 140, // TAMAÑO MUCHO MÁS GRANDE
  hp: 100
};

// Efectos de Chispas
let sparks = [];

function createSparks(x, y) {
  sparks = [];
  for (let i = 0; i < 15; i++) {
    sparks.push({
      x: x,
      y: y + (Math.random() * 60 - 30),
      vx: Math.random() * 6 + 2,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 6 + 3,
      color: Math.random() > 0.5 ? '#ff4500' : '#ffcc00',
      life: 15
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Línea de Suelo
  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 205);
  ctx.lineTo(canvas.width, 205);
  ctx.stroke();

  // --- DIBUJAR PARRILLERO ---
  if (imgP1.complete && imgP1.naturalWidth !== 0) {
    ctx.drawImage(imgP1, p1.x, p1.y, p1.w, p1.h);
  } else {
    // Si no carga la imagen, dibuja un cuadro de respaldo limpia sin bordes
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  }

  // --- DIBUJAR ROBOT ---
  // Cuerpo metálico
  ctx.fillStyle = '#64748b';
  ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
  // Ojos Rojos
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(p2.x + 25, p2.y + 25, 20, 12);
  ctx.fillRect(p2.x + 75, p2.y + 25, 20, 12);

  // --- ARO DE LUZ AMARILLO (DEFENSA) ---
  if (p1.isDefending) {
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffe600';
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(
      p1.x + p1.w / 2, 
      p1.y + p1.h / 2, 
      p1.w / 1.3, 
      p1.h / 1.3, 
      0, 0, Math.PI * 2
    );
    ctx.stroke();
    ctx.shadowBlur = 0; // Resetear sombra
  }

  // --- ATAQUE DE FUEGO / CHISPAS ---
  if (p1.isAttacking) {
    // Dibujar chispas de fuego
    sparks.forEach(s => {
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      s.x += s.vx;
      s.y += s.vy;
      s.life--;
    });
  }

  // --- BOLA DE FUEGO (ESPECIAL) ---
  if (p1.fireball) {
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff4500';
    ctx.fillStyle = '#ff3300';
    ctx.beginPath();
    ctx.arc(p1.fireball.x, p1.fireball.y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    p1.fireball.x += 10;

    // Colisión con Robot
    if (p1.fireball.x >= p2.x) {
      p2.hp = Math.max(0, p2.hp - 15);
      updateHP();
      p1.fireball = null;
    } else if (p1.fireball.x > canvas.width) {
      p1.fireball = null;
    }
  }

  requestAnimationFrame(draw);
}

// Controles y Lógica
function moveP1(dir) {
  p1.x = Math.max(0, Math.min(canvas.width - p1.w, p1.x + dir));
}

function jumpP1() {
  if (p1.y === 65) {
    p1.y = 20;
    setTimeout(() => { p1.y = 65; }, 350);
  }
}

function attackP1() {
  p1.isAttacking = true;
  p1.isDefending = false;
  createSparks(p1.x + p1.w, p1.y + p1.h / 2);

  // Daño al robot si está a alcance de la ráfaga
  if (p1.x + p1.w + 30 >= p2.x) {
    p2.hp = Math.max(0, p2.hp - 8);
    updateHP();
  }

  setTimeout(() => { p1.isAttacking = false; }, 300);
}

function defendP1() {
  p1.isDefending = true;
  setTimeout(() => { p1.isDefending = false; }, 1200);
}

function specialP1() {
  if (!p1.fireball) {
    p1.fireball = { x: p1.x + p1.w, y: p1.y + p1.h / 2 };
  }
}

function updateHP() {
  document.getElementById('hp-p2').style.width = p2.hp + '%';
}

draw();
</script>
</body>
</html>
