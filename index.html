<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Div Brawlers: Cyberpunk Grill</title>
  <style>
    body { background-color: #0d0e15; color: white; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #00f0ff; font-size: 1.1rem; margin: 5px 0; text-shadow: 0 0 8px #00f0ff; }
    #game-container { position: relative; display: inline-block; width: 100%; max-width: 500px; }
    canvas { border: 3px solid #ff007f; border-radius: 6px; display: block; margin: 0 auto; width: 100%; background: #000; }
    .hud { display: flex; justify-content: space-between; padding: 5px 10px; font-weight: bold; font-size: 0.8rem; }
    .bar-bg { width: 110px; height: 14px; background: #222; border: 1px solid #00f0ff; margin-top: 2px; }
    .bar-fill { height: 100%; transition: width 0.15s; background: #00ff66; }
    #hp-p2 { background: #ff0055; }
    #btn-retry { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 1.5rem; cursor: pointer; background: #0d0e15; color: #00f0ff; border: 3px solid #00f0ff; z-index: 20; border-radius: 10px; }
    .controls { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .row { display: flex; gap: 8px; justify-content: center; width: 100%; }
    button { padding: 12px 18px; font-weight: bold; border: none; border-radius: 6px; color: white; touch-action: manipulation; cursor: pointer; }
    .btn-atk { background: #dc2626; }
    .btn-spc { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: CYBERPUNK GRILL</h1>

  <div id="game-container">
    <div class="hud">
      <div>PARRILLERO<div class="bar-bg"><div id="hp-p1" class="bar-fill" style="width:100%"></div></div></div>
      <div id="round-txt">NIVEL 1 - RONDA 1</div>
      <div><span id="oponente-name">ROBOT</span><div class="bar-bg"><div id="hp-p2" class="bar-fill" style="width:100%"></div></div></div>
    </div>
    <canvas id="canvas" width="500" height="230"></canvas>
    <button id="btn-retry" onclick="location.reload()">REINICIAR 🔄</button>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-atk" onclick="attackP1()">🔥 ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">💥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const CHARS = [
  {name: 'ROBOT', img: 'robot.png', color: '#00f0ff'},
  {name: 'CHEF ANDROID', img: 'chef.png', color: '#ff0055'},
  {name: 'NINJA BARBACOA', img: 'ninja.png', color: '#ffaa00'}
];

let round = 1, gameOver = false, oponenteActual;
let p1 = {x: 50, y: 80, img: new Image(), isAttacking: false, fireball: null, hp: 100};
let p2 = {x: 350, y: 80, img: new Image(), isAttacking: false, hp: 100};
p1.img.src = 'parrillero.png';

function setOponente() {
  // Lógica: 1-3 Robot, 4-6 Chef/Ninja, 7-9 Cualquiera
  let index;
  if (round <= 3) index = 0;
  else if (round <= 6) index = Math.floor(Math.random() * 2) + 1;
  else index = Math.floor(Math.random() * 3);
  
  oponenteActual = CHARS[index];
  p2.img.src = oponenteActual.img;
  document.getElementById('oponente-name').innerText = oponenteActual.name;
  document.getElementById('round-txt').innerText = "NIVEL " + Math.ceil(round/3) + " - RONDA " + round;
  p1.hp = 100; p2.hp = 100;
  updateHUD();
}

function updateHUD() {
  document.getElementById('hp-p1').style.width = p1.hp + '%';
  document.getElementById('hp-p2').style.width = p2.hp + '%';
}

function drawEnergyBall(f) {
  ctx.fillStyle = oponenteActual.color;
  ctx.beginPath(); ctx.arc(f.x, f.y, 15, 0, Math.PI*2); ctx.fill();
}

function drawLaserSlash(p) {
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
  ctx.shadowBlur = 30; ctx.shadowColor = (p === p1) ? '#00f0ff' : oponenteActual.color;
  ctx.beginPath();
  ctx.arc(p.x + (p === p1 ? 80 : 0), p.y + 60, 100, -Math.PI/4, Math.PI/4);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function attackP1() {
  if (gameOver) return;
  p1.isAttacking = true;
  p2.hp = Math.max(0, p2.hp - 10);
  updateHUD();
  setTimeout(() => p1.isAttacking = false, 300);
  checkWin();
}

function specialP1() {
  if (gameOver || p1.fireball) return;
  p1.fireball = { x: p1.x + 80, y: p1.y + 50 };
}

function checkWin() {
  if (p2.hp <= 0) {
    if (round < 9) {
      round++;
      setOponente();
    } else {
      finishGame();
    }
  }
}

function finishGame() {
  gameOver = true;
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0,0, canvas.width, canvas.height);
  ctx.fillStyle = "yellow";
  ctx.font = "bold 25px monospace";
  ctx.textAlign = "center";
  ctx.fillText("¡CAMPEÓN DEFINIDO!", 250, 115);
  document.getElementById('btn-retry').style.display = 'block';
}

function gameLoop() {
  if (gameOver) return; // Pantalla estática
  
  ctx.fillStyle = "#000"; ctx.fillRect(0,0, canvas.width, canvas.height);
  ctx.drawImage(p1.img, p1.x, p1.y, 100, 120);
  ctx.drawImage(p2.img, p2.x, p2.y, 100, 120);
  
  if (p1.fireball) { 
    drawEnergyBall(p1.fireball); 
    p1.fireball.x += 8; 
    if(p1.fireball.x > 500) p1.fireball = null; 
    // Colisión simple de especial
    if(p1.fireball.x >= p2.x) { p2.hp = Math.max(0, p2.hp - 20); p1.fireball = null; updateHUD(); checkWin(); }
  }
  
  if (p1.isAttacking) drawLaserSlash(p1);
  
  requestAnimationFrame(gameLoop);
}

setOponente();
gameLoop();
</script>
</body>
</html>
