<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Brawlers: Parrillero vs Robot</title>
  <style>
    body {
      background-color: #1a1a24;
      color: white;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #ff9900;
      font-size: 1.2rem;
      margin: 5px 0;
    }
    #game-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    canvas {
      background-color: #2b2b3d;
      border: 3px solid #ffffff;
      border-radius: 4px;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .bar-bg {
      width: 120px;
      height: 14px;
      background: #444;
      border: 1px solid #fff;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    #hp-p1 { background: #00ff66; width: 100%; }
    #hp-p2 { background: #ff3333; width: 100%; }
    
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    button {
      padding: 12px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      touch-action: manipulation;
    }
    .btn-move { background: #334155; width: 60px; }
    .btn-jump { background: #475569; width: 100px; }
    .btn-def  { background: #0284c7; }
    .btn-atk  { background: #dc2626; }
    .btn-spc  { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: PARRILLERO VS ROBOT 🍖🤖</h1>

  <div id="game-container">
    <div class="hud">
      <div>
        <span>EL PARRILLERO</span>
        <div class="bar-bg"><div id="hp-p1" class="bar-fill"></div></div>
      </div>
      <div>RONDA 1</div>
      <div>
        <span>ROBOT FUTURISTA</span>
        <div class="bar-bg"><div id="hp-p2" class="bar-fill"></div></div>
      </div>
    </div>
    <canvas id="canvas" width="400" height="200"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-move" onclick="moveP1(-10)">◀</button>
      <button class="btn-move" onclick="moveP1(10)">▶</button>
      <button class="btn-jump" onclick="jumpP1()">▲ SALTAR</button>
    </div>
    <div class="row">
      <button class="btn-def" onclick="defendP1()">🛡️ DEFENDER</button>
      <button class="btn-atk" onclick="attackP1()">⚔️ ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">🔥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Cargar Imágenes
const imgP1 = new Image();
imgP1.src = 'parrillero.png'; // Asegúrate de que el nombre coincida exactamente

// Estado del jugador 1 (Parrillero)
const p1 = {
  x: 40,
  y: 90,
  w: 65,  // Tamaño aumentado
  h: 85,  // Tamaño aumentado
  hp: 100,
  isAttacking: false,
  isDefending: false,
  fireball: null
};

// Estado del Bot (Robot)
const p2 = {
  x: 290,
  y: 90,
  w: 65,  // Tamaño aumentado
  h: 85,  // Tamaño aumentado
  hp: 100
};

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Línea de Suelo
  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 175);
  ctx.lineTo(canvas.width, 175);
  ctx.stroke();

  // --- DIBUJAR PARRILLERO ---
  if (imgP1.complete && imgP1.naturalWidth !== 0) {
    ctx.drawImage(imgP1, p1.x, p1.y, p1.w, p1.h);
  } else {
    // Si no carga la imagen, dibuja un cuadro azul de respaldo
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  }

  // Efecto de Defensa (Escudo Azul)
  if (p1.isDefending) {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(p1.x + p1.w / 2, p1.y + p1.h / 2, 45, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Efecto de Ataque (Espada / Corte)
  if (p1.isAttacking) {
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(p1.x + p1.w + 10, p1.y + 30, 25, -Math.PI / 4, Math.PI / 4);
    ctx.stroke();
  }

  // Bola de fuego (Especial)
  if (p1.fireball) {
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(p1.fireball.x, p1.fireball.y, 12, 0, Math.PI * 2);
    ctx.fill();
    p1.fireball.x += 8;

    // Colisión Bola de Fuego con Robot
    if (p1.fireball.x >= p2.x) {
      p2.hp = Math.max(0, p2.hp - 15);
      updateHP();
      p1.fireball = null;
    } else if (p1.fireball.x > canvas.width) {
      p1.fireball = null;
    }
  }

  // --- DIBUJAR ROBOT ---
  // Cuerpo del robot (más grande)
  ctx.fillStyle = '#64748b';
  ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
  // Ojos Rojos
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(p2.x + 10, p2.y + 15, 12, 8);
  ctx.fillRect(p2.x + 35, p2.y + 15, 12, 8);

  requestAnimationFrame(draw);
}

// Acciones
function moveP1(dir) {
  p1.x = Math.max(0, Math.min(canvas.width - p1.w, p1.x + dir));
}

function jumpP1() {
  if (p1.y === 90) {
    p1.y = 40;
    setTimeout(() => { p1.y = 90; }, 400);
  }
}

function attackP1() {
  p1.isAttacking = true;
  p1.isDefending = false;
  
  // Golpe al robot si está cerca
  if (p1.x + p1.w + 20 >= p2.x) {
    p2.hp = Math.max(0, p2.hp - 10);
    updateHP();
  }

  setTimeout(() => { p1.isAttacking = false; }, 200);
}

function defendP1() {
  p1.isDefending = true;
  setTimeout(() => { p1.isDefending = false; }, 1000);
}

function specialP1() {
  if (!p1.fireball) {
    p1.fireball = { x: p1.x + p1.w, y: p1.y + 30 };
  }
}

function updateHP() {
  document.getElementById('hp-p2').style.width = p2.hp + '%';
}

draw();
</script>
</body>
</html>
