<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Brawlers: Parrillero vs Robot</title>
  <style>
    body {
      background-color: #1a1a24;
      color: white;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h1 {
      color: #ff9900;
      font-size: 1.1rem;
      margin: 5px 0;
    }
    #game-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
    }
    canvas {
      border: 3px solid #ffffff;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      width: 100%;
      height: auto;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .bar-bg {
      width: 110px;
      height: 14px;
      background: #444;
      border: 1px solid #fff;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    #hp-p1 { background: #00ff66; width: 100%; }
    #hp-p2 { background: #ff3333; width: 100%; }
    
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    button {
      padding: 12px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      touch-action: manipulation;
    }
    .btn-move { background: #334155; width: 60px; }
    .btn-jump { background: #475569; width: 100px; }
    .btn-def  { background: #eab308; color: #000; }
    .btn-atk  { background: #dc2626; }
    .btn-spc  { background: #9333ea; }
  </style>
</head>
<body>

  <h1>DIV BRAWLERS: PARRILLERO VS ROBOT 🍖🤖</h1>

  <div id="game-container">
    <div class="hud">
      <div>
        <span>EL PARRILLERO</span>
        <div class="bar-bg"><div id="hp-p1" class="bar-fill"></div></div>
      </div>
      <div>RONDA 1</div>
      <div>
        <span>ROBOT FUTURISTA</span>
        <div class="bar-bg"><div id="hp-p2" class="bar-fill"></div></div>
      </div>
    </div>
    <canvas id="canvas" width="500" height="230"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-move" onclick="moveP1(-15)">◀</button>
      <button class="btn-move" onclick="moveP1(15)">▶</button>
      <button class="btn-jump" onclick="jumpP1()">▲ SALTAR</button>
    </div>
    <div class="row">
      <button class="btn-def" onclick="defendP1()">🛡️ DEFENDER</button>
      <button class="btn-atk" onclick="attackP1()">🔥 ATACAR</button>
      <button class="btn-spc" onclick="specialP1()">💥 ESPECIAL</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Cargar Imágenes
const imgP1 = new Image();
imgP1.src = 'parrillero.png';

const imgP2 = new Image();
imgP2.src = 'robot.png';

// Jugadores
const p1 = {
  x: 20,
  y: 35,
  w: 120,
  h: 160,
  hp: 100,
  isAttacking: false,
  isDefending: false,
  fireball: null
};

const p2 = {
  x: 360,
  y: 35,
  w: 120,
  h: 160,
  hp: 100,
  isAttacking: false,
  isDefending: false
};

let sparks = [];

function createSparks(x, y) {
  for (let i = 0; i < 12; i++) {
    sparks.push({
      x: x,
      y: y + (Math.random() * 60 - 30),
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 5 + 3,
      color: Math.random() > 0.5 ? '#ff4500' : '#ffcc00',
      life: 12
    });
  }
}

// Dibuja el escenario de Restaurante Rural
function drawRuralRestaurantBackground() {
  // Cielo al atardecer rural
  let skyGradient = ctx.createLinearGradient(0, 0, 0, 200);
  skyGradient.addColorStop(0, '#1e1b4b');
  skyGradient.addColorStop(1, '#7c2d12');
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Montañas del paisaje rural
  ctx.fillStyle = '#064e3b';
  ctx.beginPath();
  ctx.moveTo(0, 160);
  ctx.lineTo(120, 90);
  ctx.lineTo(250, 160);
  ctx.lineTo(380, 100);
  ctx.lineTo(500, 160);
  ctx.lineTo(500, 200);
  ctx.lineTo(0, 200);
  ctx.fill();

  // Estructura de Madera del Restaurant Rural (Fondo)
  ctx.fillStyle = '#451a03';
  ctx.fillRect(40, 60, 420, 138); // Pared principal
  
  // Ventanas iluminadas con ambiente cálido
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(70, 85, 60, 50);
  ctx.fillRect(370, 85, 60, 50);
  
  // Detalle Ventanas (Marcos)
  ctx.strokeStyle = '#292524';
  ctx.lineWidth = 2;
  ctx.strokeRect(70, 85, 60, 50);
  ctx.strokeRect(370, 85, 60, 50);

  // Cartel del Restaurant Rural
  ctx.fillStyle = '#78350f';
  ctx.fillRect(180, 70, 140, 30);
  ctx.strokeStyle = '#f59e0b';
  ctx.strokeRect(180, 70, 140, 30);
  ctx.fillStyle = '#fef08a';
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('RESTAURANT RURAL', 188, 89);

  // Suelo de tablas de madera/tierra
  ctx.fillStyle = '#78350f';
  ctx.fillRect(0, 195, canvas.width, 35);
  ctx.strokeStyle = '#451a03';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 195);
  ctx.lineTo(canvas.width, 195);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Fondo Restaurante Rural
  drawRuralRestaurantBackground();

  // --- DIBUJAR PARRILLERO ---
  if (imgP1.complete && imgP1.naturalWidth !== 0) {
    ctx.drawImage(imgP1, p1.x, p1.y, p1.w, p1.h);
  } else {
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  }

  // --- DIBUJAR ROBOT FUTURISTA ---
  if (imgP2.complete && imgP2.naturalWidth !== 0) {
    ctx.drawImage(imgP2, p2.x, p2.y, p2.w, p2.h);
  } else {
    ctx.fillStyle = '#475569';
    ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
  }

  // --- AROS DE LUZ AMARILLOS (DEFENSA) ---
  [p1, p2].forEach(p => {
    if (p.isDefending) {
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffe600';
      ctx.strokeStyle = '#ffee00';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 1.4, p.h / 1.4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  });

  // --- CHISPAS Y FUEGO ---
  for (let i = sparks.length - 1; i >= 0; i--) {
    let s = sparks[i];
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    s.x += s.vx;
    s.y += s.vy;
    s.life--;
    if (s.life <= 0) sparks.splice(i, 1);
  }

  // --- BOLA DE FUEGO ---
  if (p1.fireball) {
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff4500';
    ctx.fillStyle = '#ff3300';
    ctx.beginPath();
    ctx.arc(p1.fireball.x, p1.fireball.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    p1.fireball.x += 10;

    // IA del Robot: reacciona defensivamente ante la bola de fuego
    if (p1.fireball.x > p2.x - 120 && p1.fireball.x < p2.x) {
      p2.isDefending = true;
      setTimeout(() => { p2.isDefending = false; }, 600);
    }

    if (p1.fireball.x >= p2.x && p1.fireball.x <= p2.x + p2.w) {
      if (!p2.isDefending) {
        p2.hp = Math.max(0, p2.hp - 15);
        updateHUD();
      }
      createSparks(p2.x, p2.y + p2.h / 2);
      p1.fireball = null;
    } else if (p1.fireball.x > canvas.width) {
      p1.fireball = null;
    }
  }

  requestAnimationFrame(draw);
}

// --- INTELIGENCIA ARTIFICIAL DEL ROBOT (COMBATE Y DEFENSA AUTOMÁTICA) ---
setInterval(() => {
  if (p2.hp <= 0 || p1.hp <= 0) return;

  const dist = p2.x - (p1.x + p1.w);
  const decision = Math.random();

  // 1. Persecución Inteligente
  if (dist > 35) {
    p2.x -= 12; // Avanza rápido hacia el parrillero
  } else if (dist < 5) {
    p2.x += 10; // Mantiene distancia corta
  }

  // 2. Reacción defensiva si el Parrillero ataca de cerca
  if (p1.isAttacking && dist < 45) {
    p2.isDefending = true;
    setTimeout(() => { p2.isDefending = false; }, 500);
    return;
  }

  // 3. Ataques automáticos
  if (dist <= 45 && decision > 0.3) {
    p2.isAttacking = true;
    createSparks(p2.x, p2.y + p2.h / 2);
    if (!p1.isDefending) {
      p1.hp = Math.max(0, p1.hp - 8);
      updateHUD();
    }
    setTimeout(() => { p2.isAttacking = false; }, 200);
  } else if (decision < 0.25) {
    // 4. Defensa aleatoria
    p2.isDefending = true;
    setTimeout(() => { p2.isDefending = false; }, 600);
  }
}, 300); // Frecuencia alta para respuestas rápidas

// Controles Jugador
function moveP1(dir) {
  p1.x = Math.max(0, Math.min(p2.x - p1.w + 10, p1.x + dir));
}

function jumpP1() {
  if (p1.y === 35) {
    p1.y = -5;
    setTimeout(() => { p1.y = 35; }, 350);
  }
}

function attackP1() {
  p1.isAttacking = true;
  p1.isDefending = false;
  createSparks(p1.x + p1.w, p1.y + p1.h / 2);

  const dist = p2.x - (p1.x + p1.w);
  if (dist <= 35 && !p2.isDefending) {
    p2.hp = Math.max(0, p2.hp - 10);
    updateHUD();
  }

  setTimeout(() => { p1.isAttacking = false; }, 250);
}

function defendP1() {
  p1.isDefending = true;
  setTimeout(() => { p1.isDefending = false; }, 1000);
}

function specialP1() {
  if (!p1.fireball) {
    p1.fireball = { x: p1.x + p1.w, y: p1.y + p1.h / 2 };
  }
}

function updateHUD() {
  document.getElementById('hp-p1').style.width = p1.hp + '%';
  document.getElementById('hp-p2').style.width = p2.hp + '%';
}

draw();
</script>
</body>
</html>
